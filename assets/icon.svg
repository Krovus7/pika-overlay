<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1d36"/>
      <stop offset="1" stop-color="#080a12"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c6af7"/>
      <stop offset="1" stop-color="#4ecdc4"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7c6af7"/>
      <stop offset="1" stop-color="#4ecdc4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.62" cy="0.36" r="0.55">
      <stop offset="0" stop-color="#7c6af7" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#7c6af7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#tile)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#glow)"/>
  <rect x="21" y="21" width="470" height="470" rx="107" fill="none" stroke="url(#edge)" stroke-width="10" stroke-opacity="0.75"/>

  <!-- Stat rows: the overlay's table -->
  <g>
    <rect x="304" y="316" width="140" height="24" rx="12" fill="#4ecdc4"/>
    <rect x="304" y="362" width="104" height="24" rx="12" fill="#7c6af7"/>
    <rect x="304" y="408" width="66" height="24" rx="12" fill="#e8eaf6" fill-opacity="0.38"/>
  </g>

  <!-- Sword, drawn upright and turned 45 degrees -->
  <g transform="rotate(45 256 256)">
    <path d="M256 40 294 96V342H218V96Z" fill="url(#blade)"/>
    <path d="M256 40 294 96V342H256Z" fill="#080a12" fill-opacity="0.22"/>
    <rect x="160" y="338" width="192" height="38" rx="19" fill="#f1f2fb"/>
    <rect x="236" y="376" width="40" height="62" fill="#5b4bd6"/>
    <circle cx="256" cy="456" r="27" fill="#f1f2fb"/>
  </g>
</svg>
