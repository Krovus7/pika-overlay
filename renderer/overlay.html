<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'" />
  <title>Pika Overlay</title>
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/titlebar.css" />
  <link rel="stylesheet" href="css/search.css" />
  <link rel="stylesheet" href="css/banner.css" />
  <link rel="stylesheet" href="css/table.css" />
  <link rel="stylesheet" href="css/row-states.css" />
  <link rel="stylesheet" href="css/footer.css" />
  <link rel="stylesheet" href="css/compact.css" />
  <link rel="stylesheet" href="css/settings-shell.css" />
  <link rel="stylesheet" href="css/settings-controls.css" />
  <link rel="stylesheet" href="css/settings-tabs.css" />
  <link rel="stylesheet" href="css/settings-panels.css" />
</head>
<body>
  <!-- Icon sprite: stroke icons, currentColor, referenced with <use href="#i-name"> -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="i-sword" viewBox="0 0 24 24"><path d="M14.5 17.5 3 6V3h3l11.5 11.5"/><path d="m13 19 6-6M16 16l4 4M19 21l2-2"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h8M18 7h2M4 17h2M12 17h8"/><circle cx="15" cy="7" r="2.5"/><circle cx="9" cy="17" r="2.5"/></symbol>
    <symbol id="i-layout" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-arrow-down" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
    <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M16 7l3 3"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h.01"/></symbol>
    <symbol id="i-circle-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></symbol>
    <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 0 1 5 .5c0 1.5-2.5 2-2.5 3.5M12 17h.01"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2 2M16 16l2 2M18 6l-2 2M8 16l-2 2"/></symbol>
    <symbol id="i-retry" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"/></symbol>
    <symbol id="i-clipboard" viewBox="0 0 24 24"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
    <symbol id="i-log-in" viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></symbol>
    <symbol id="i-bed" viewBox="0 0 24 24"><path d="M2 4v16M2 8h18a2 2 0 0 1 2 2v10M2 17h20M6 8v9"/></symbol>
    <symbol id="i-diamond" viewBox="0 0 24 24"><path d="m12 3 9 9-9 9-9-9z"/></symbol>
    <symbol id="i-radar" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><path d="M12 12 18 6"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-circle-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 3 3 5-6"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 5.1A9.7 9.7 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4M6.5 6.6A16.6 16.6 0 0 0 2 12s3.6 7 10 7a9.6 9.6 0 0 0 4.3-1M9.9 9.9a3 3 0 0 0 4.2 4.2"/></symbol>
    <symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
    <symbol id="i-grip" viewBox="0 0 24 24"><path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01" stroke-width="3"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></symbol>
    <symbol id="i-palette" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.8-.8 1.8-1.7 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-1 .8-1.8 1.8-1.8H16a5 5 0 0 0 5-5c0-3.9-4-7.1-9-7.1z"/><path d="M7.5 11h.01M10.5 7h.01M15 7.5h.01"/></symbol>
    <symbol id="i-columns" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M15 4v16"/></symbol>
    <symbol id="i-droplet" viewBox="0 0 24 24"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></symbol>
    <symbol id="i-terminal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3M13 15h4"/></symbol>
  </svg>

  <!-- Title bar -->
  <div id="titlebar" class="titlebar">
    <div class="titlebar-left">
      <span class="logo"><svg class="ic"><use href="#i-sword"/></svg><span>Pika<span class="logo-accent">Overlay</span></span></span>
      <span class="logo-version"></span>
      <span id="status-badge" class="status-pill is-idle">Idle</span>
    </div>
    <div class="titlebar-right">
      <button id="btn-theme" class="icon-btn" title="Switch to light theme"><svg class="ic"><use id="theme-icon" href="#i-sun"/></svg></button>
      <button id="btn-toggle-view" class="icon-btn" title="Switch to Compact layout"><svg class="ic"><use href="#i-layout"/></svg></button>
      <button id="btn-clear" class="icon-btn" title="Clear players"><svg class="ic"><use href="#i-trash"/></svg></button>
      <button id="btn-settings" class="icon-btn" title="Settings"><svg class="ic"><use href="#i-sliders"/></svg></button>
      <button id="btn-minimize" class="icon-btn" title="Minimize"><svg class="ic"><use href="#i-minus"/></svg></button>
      <button id="btn-close" class="icon-btn btn-close-x" title="Hide"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>
  </div>

  <!-- Search bar (hidden in compact mode) -->
  <div class="search-bar">
    <div class="search-input-wrap">
      <svg class="ic search-icon"><use href="#i-search"/></svg>
      <input id="search-input" type="text"
        placeholder="Search a player or paste names"
        title="Press Enter to search. Paste several names for a bulk lookup. Period and mode apply to every row."
        autocomplete="off" spellcheck="false" />
      <button id="btn-lookup" class="btn-primary">Search</button>
      <div class="period-divider"></div>

      <div class="filter-dropdown-wrap" id="period-wrap">
        <button class="filter-btn" id="btn-period" title="Stats time period">
          <span id="period-label">All Time</span>
          <svg class="ic filter-chevron"><use href="#i-chevron"/></svg>
        </button>
        <div class="filter-dropdown" id="period-dropdown">
          <div class="filter-option selected" data-value="total">All Time</div>
          <div class="filter-option" data-value="weekly">Weekly</div>
          <div class="filter-option" data-value="monthly">Monthly</div>
          <div class="filter-option" data-value="yearly">Yearly</div>
        </div>
      </div>

      <div class="filter-dropdown-wrap" id="mode-wrap">
        <button class="filter-btn" id="btn-mode" title="Game mode">
          <span id="mode-label">Overall</span>
          <svg class="ic filter-chevron"><use href="#i-chevron"/></svg>
        </button>
        <div class="filter-dropdown" id="mode-dropdown">
          <div class="filter-option selected" data-value="ALL_MODES">Overall</div>
          <div class="filter-option" data-value="SOLO">Solo</div>
          <div class="filter-option" data-value="DOUBLES">Duo</div>
          <div class="filter-option" data-value="TRIPLES">Triples</div>
          <div class="filter-option" data-value="QUAD">Quad</div>
        </div>
      </div>
    </div>
  </div>

  <!-- API health banner (visible only when health is not ok) -->
  <div id="api-banner" class="api-banner" role="status" hidden>
    <svg class="ic"><use id="banner-icon" href="#i-key"/></svg>
    <span id="banner-text" class="banner-text"></span>
    <button id="banner-settings" class="banner-btn" hidden>Open Settings</button>
  </div>

  <!-- Stats table -->
  <div class="table-wrapper">
    <table id="stats-table">
      <thead><tr id="stats-thead-row"></tr></thead>
      <tbody id="stats-body"></tbody>
    </table>

    <div id="empty-state" class="empty-state">
      <div class="empty-icon"><svg class="ic"><use id="empty-icon-use" href="#i-radar"/></svg></div>
      <div id="empty-title" class="empty-title">Waiting for players</div>
      <div id="empty-sub" class="empty-sub"></div>
      <button id="empty-action" class="btn-primary empty-action" hidden>Open Settings</button>
    </div>
  </div>

  <!-- Footer (hidden in compact mode) -->
  <div class="footer-bar">
    <div id="footer-count">0 players</div>
    <div class="footer-meta">
      <span id="footer-by">by AcquaPanna</span>
      <span class="footer-api">stats.pika-network.net</span>
    </div>
  </div>

  <!-- Inline settings panel: every control saves itself, tab content is built by renderer/ts/settings/ -->
  <div id="settings-panel" class="settings-panel" role="dialog" aria-modal="true" aria-label="Settings">
    <header class="settings-header">
      <div class="settings-title">
        <svg class="ic"><use href="#i-sliders"/></svg>
        <h1>Settings</h1>
        <span id="settings-version" class="settings-version"></span>
      </div>
      <span id="settings-save-status" class="settings-save-status" role="status" aria-live="polite"></span>
      <button id="btn-settings-close-x" class="icon-btn btn-close-x" title="Close (Esc)" aria-label="Close settings"><svg class="ic"><use href="#i-x"/></svg></button>
    </header>

    <nav class="settings-tab-nav" role="tablist" aria-label="Settings sections">
      <button class="settings-tab-btn active" data-tab="general" role="tab" id="tabbtn-general" aria-controls="tab-general" aria-selected="true" title="General"><svg class="ic"><use href="#i-sliders"/></svg><span class="tab-label">General</span></button>
      <button class="settings-tab-btn" data-tab="api" role="tab" id="tabbtn-api" aria-controls="tab-api" aria-selected="false" title="API"><svg class="ic"><use href="#i-key"/></svg><span class="tab-label">API</span></button>
      <button class="settings-tab-btn" data-tab="appearance" role="tab" id="tabbtn-appearance" aria-controls="tab-appearance" aria-selected="false" title="Appearance"><svg class="ic"><use href="#i-palette"/></svg><span class="tab-label">Appearance</span></button>
      <button class="settings-tab-btn" data-tab="columns" role="tab" id="tabbtn-columns" aria-controls="tab-columns" aria-selected="false" title="Columns"><svg class="ic"><use href="#i-columns"/></svg><span class="tab-label">Columns</span></button>
      <button class="settings-tab-btn" data-tab="stats" role="tab" id="tabbtn-stats" aria-controls="tab-stats" aria-selected="false" title="Colors"><svg class="ic"><use href="#i-droplet"/></svg><span class="tab-label">Colors</span></button>
      <button class="settings-tab-btn" data-tab="updates" role="tab" id="tabbtn-updates" aria-controls="tab-updates" aria-selected="false" title="Updates"><svg class="ic"><use href="#i-download"/></svg><span class="tab-label">Updates</span></button>
      <button class="settings-tab-btn" data-tab="debug" role="tab" id="tabbtn-debug" aria-controls="tab-debug" aria-selected="false" title="Debug"><svg class="ic"><use href="#i-terminal"/></svg><span class="tab-label">Debug</span></button>
    </nav>

    <div id="settings-body" class="settings-body">
      <div id="tab-general" class="settings-tab-panel active" role="tabpanel" aria-labelledby="tabbtn-general"></div>
      <div id="tab-api" class="settings-tab-panel" role="tabpanel" aria-labelledby="tabbtn-api"></div>
      <div id="tab-appearance" class="settings-tab-panel" role="tabpanel" aria-labelledby="tabbtn-appearance"></div>
      <div id="tab-columns" class="settings-tab-panel" role="tabpanel" aria-labelledby="tabbtn-columns"></div>
      <div id="tab-stats" class="settings-tab-panel" role="tabpanel" aria-labelledby="tabbtn-stats"></div>
      <div id="tab-updates" class="settings-tab-panel" role="tabpanel" aria-labelledby="tabbtn-updates"></div>
      <div id="tab-debug" class="settings-tab-panel" role="tabpanel" aria-labelledby="tabbtn-debug"></div>
    </div>
  </div>

  <script src="bundle/overlay.js"></script>
</body>
</html>
